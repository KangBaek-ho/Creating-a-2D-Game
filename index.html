<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>막대 인간 사진 산책</title>
<style>
  :root {
    --ink: #1f2a44;
    --paper: #f3f5f8;
    --line: #c9d3e3;
    --red: #d21f1f;
    --blue: #2b5fd9;
    --teal: #0a8f9e;
    --desk: #27314a;
    --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Nanum Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--desk);
    font-family: var(--font);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  .panel {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 244px;
    max-height: calc(100vh - 110px);
    overflow: auto;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px 12px;
    box-shadow: 0 6px 24px rgba(10, 16, 32, 0.28);
    font-size: 14px;
    line-height: 1.4;
  }
  .panel summary {
    font-weight: 700;
    padding: 2px 0 6px;
    list-style-position: inside;
  }
  .panel .stack { display: grid; gap: 10px; padding-top: 4px; }
  .panel label.row { display: grid; gap: 4px; }
  .panel .rowhead { display: flex; justify-content: space-between; font-size: 13px; }
  .panel .rowhead output { color: #56627e; font-variant-numeric: tabular-nums; }
  .panel input[type="range"] { width: 100%; margin: 0; accent-color: var(--red); }
  .map-note { margin: 0; font-size: 12.5px; color: #56627e; }
  .map-box { display: grid; gap: 8px; }
  .map-box select {
    font: inherit;
    font-size: 13px;
    width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--ink);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tools .wide { grid-column: 1 / -1; }
  .edit-help { margin: 8px 0 0; font-size: 12.5px; color: #56627e; }

  .file-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .file-row button { padding: 8px 6px; font-size: 13px; }
  .text-box { display: grid; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  textarea {
    font: inherit;
    font-size: 13px;
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--ink);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    resize: vertical;
    -webkit-user-select: text;
    user-select: text;
    cursor: text;
  }
  #pickObjImage { margin-top: 8px; width: 100%; }
  .paint-box { display: grid; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .paint-row { display: flex; gap: 8px; align-items: stretch; }
  .paint-row input[type="color"] {
    width: 48px;
    height: auto;
    min-height: 34px;
    padding: 2px;
    border: 1px solid var(--ink);
    border-radius: 8px;
    background: #fff;
  }
  .paint-row button { flex: 1; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch {
    width: 22px;
    height: 22px;
    padding: 0;
    border-radius: 6px;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px #9aa8c2;
  }
  .sel-info { margin: 0; font-size: 12.5px; color: #56627e; }

  button {
    font: inherit;
    border-radius: 8px;
    border: 1px solid var(--ink);
    padding: 8px 12px;
    background: var(--ink);
    color: #fff;
    font-weight: 700;
  }
  button:disabled { opacity: 0.45; }
  button.ghost { background: #fff; color: var(--ink); }
  button.ghost[aria-pressed="true"] {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }
  button.ghost.edit[aria-pressed="true"] {
    background: var(--blue);
    border-color: var(--blue);
  }
  button.ghost.hit[aria-pressed="true"] {
    background: var(--teal);
    border-color: var(--teal);
  }
  button.ghost.tool { padding: 7px 6px; font-size: 13px; }
  button.ghost.tool[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 18px;
    padding: 9px 16px;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid var(--line);
    border-radius: 18px;
    font-size: 13.5px;
    box-shadow: 0 6px 24px rgba(10, 16, 32, 0.28);
    max-width: calc(100vw - 24px);
  }
  .hint span { white-space: nowrap; }
  kbd {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    display: inline-block;
    min-width: 22px;
    text-align: center;
    padding: 1px 6px;
    margin-right: 2px;
    border: 1px solid #9aa8c2;
    border-bottom-width: 2px;
    border-radius: 5px;
    background: #fff;
  }

  .badge {
    position: fixed;
    top: 16px;
    right: 16px;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--blue);
    color: #fff;
    font-size: 13.5px;
    font-weight: 700;
    box-shadow: 0 6px 24px rgba(10, 16, 32, 0.28);
    pointer-events: none;
  }
  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 14px;
    max-width: calc(100vw - 32px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .drop-veil {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(31, 42, 68, 0.72);
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    border: 4px dashed #fff;
    pointer-events: none;
  }
  .drop-veil.show { display: flex; }

<body>
<canvas id="game" aria-label="게임 화면"></canvas>

<details class="panel">
  <summary>설정</summary>
  <div class="stack">
    <button type="button" id="pickBtn">새 맵 만들기 (사진 고르기)</button>
    <input type="file" id="mapFile" accept="image/*" hidden>
    <input type="file" id="objImageFile" accept="image/*" hidden>
    <div class="file-row">
      <button type="button" id="saveBtn">저장</button>
      <button type="button" id="saveAsBtn" class="ghost">다른 이름으로 저장</button>
    </div>

    <div class="map-box" id="mapBox">
      <label class="row">
        <span class="rowhead">저장된 맵</span>
        <select id="mapSelect" aria-label="저장된 맵 고르기"></select>
      </label>
      <button type="button" id="delMapBtn" class="ghost">이 맵 삭제</button>
    </div>
    <p class="map-note" id="mapNote"></p>

    <label class="row">
      <span class="rowhead">캐릭터 크기 <output id="sizeOut">1.0배</output></span>
      <input type="range" id="sizeRange" min="0.5" max="2" step="0.05" value="1">
    </label>
    <label class="row">
      <span class="rowhead">맵 확대 <output id="zoomOut">2.5배</output></span>
      <input type="range" id="zoomRange" min="1" max="4" step="0.1" value="2.5">
    </label>

    <button type="button" id="danceBtn" class="ghost" aria-pressed="false">춤 모드: 꺼짐</button>
    <button type="button" id="hitBtn" class="ghost hit" aria-pressed="false">히트 박스 보기: 꺼짐</button>
    <button type="button" id="editBtn" class="ghost edit" aria-pressed="false">편집 모드: 꺼짐</button>
    <button type="button" id="gravBtn" class="ghost" aria-pressed="false">중력 적용: 꺼짐</button>

    <div id="editTools" hidden>
      <div class="tools" role="group" aria-label="편집 도구">
        <button type="button" class="ghost tool" data-tool="select" aria-pressed="true">선택</button>
        <button type="button" class="ghost tool" data-tool="paint" aria-pressed="false">색 입히기</button>
      </div>
      <details class="ins" open>
        <summary>삽입</summary>
        <details class="ins" open>
          <summary>도형</summary>
          <div class="tools" role="group" aria-label="도형">
            <button type="button" class="ghost tool" data-tool="wall" aria-pressed="false">벽</button>
            <button type="button" class="ghost tool" data-tool="hazard" aria-pressed="false">즉사 구역</button>
            <button type="button" class="ghost tool" data-tool="triangle" aria-pressed="false">삼각형</button>
            <button type="button" class="ghost tool" data-tool="circle" aria-pressed="false">원</button>
            <button type="button" class="ghost tool" data-tool="star" aria-pressed="false">별</button>
            <button type="button" class="ghost tool" data-tool="tele" aria-pressed="false">텔레포터</button>
          </div>
        </details>
        <div class="tools" style="margin-top:6px">
          <button type="button" class="ghost tool" data-tool="spawn" aria-pressed="false">스폰 지점</button>
          <button type="button" class="ghost tool" data-tool="text" aria-pressed="false">글자</button>
          <button type="button" class="ghost tool wide" data-tool="image" aria-pressed="false">이미지</button>
        </div>
      </details>
      <p class="edit-help" id="editHelp"></p>
      <button type="button" class="ghost" id="pickObjImage" hidden>이미지 고르기</button>

      <div class="paint-box" id="shapeBox" hidden>
        <label class="row">
          <span class="rowhead">회전 각도 <output id="rotOut">0°</output></span>
          <input type="range" id="rotRange" min="0" max="359" step="1" value="0">
        </label>
        <label class="row" id="modeRow">
          <span class="rowhead">성질</span>
          <select id="modeSel" aria-label="도형 성질"><option value="wall">벽 (지나갈 수 없음)</option><option value="hazard">즉사 구역</option><option value="pass">지나갈 수 있음</option></select>
        </label>
        <p class="sel-info">플레이 중 계속 돌리려면 도형 위에서 우클릭 → 회전</p>
      </div>

      <div class="text-box" id="textBox" hidden>
        <label class="row">
          <span class="rowhead">글자 내용</span>
          <textarea id="textInput" rows="3" aria-label="글자 내용"></textarea>
        </label>
        <label class="row">
          <span class="rowhead">글자 크기 <output id="textSizeOut">24</output></span>
          <input type="range" id="textSize" min="6" max="160" step="1" value="24">
        </label>
      </div>

      <div class="paint-box" id="paintBox" hidden>
        <div class="paint-row">
          <input type="color" id="colorInput" value="#7a5230" aria-label="색 고르기">
          <button type="button" id="applyPaint">입히기</button>
        </div>
        <div class="swatches" id="swatches" role="group" aria-label="자주 쓰는 색"></div>
        <button type="button" class="ghost" id="clearPaint">색 지우기 (다시 투명하게)</button>
        <p class="sel-info" id="selInfo" aria-live="polite"></p>
      </div>
    </div>
  </div>
</details>

<div class="badge" id="badge" hidden>편집 모드</div>

<div class="hint">
  <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span>
  <span><kbd>Space</kbd> 점프 (꾹 누르면 계속)</span>
  <span><kbd>X</kbd> 앉기</span>
  <span><kbd>Shift</kbd> 웅크리기</span>
  <span><kbd>1</kbd> 춤 켜기/끄기</span>
  <span><kbd>R</kbd> 히트 박스 보기</span>
  <span class="devonly"><kbd>E</kbd> 편집 모드</span>
  <span class="editonly" hidden><kbd>Del</kbd> 삭제</span>
  <span class="editonly" hidden><kbd>Ctrl</kbd><kbd>Z</kbd> 되돌리기</span>
  <span class="editonly" hidden><kbd>Ctrl</kbd><kbd>C</kbd><kbd>V</kbd> 복사·붙여넣기</span>
  <span class="editonly" hidden><kbd>Ctrl</kbd><kbd>A</kbd> 전체 선택</span>
</div>

<div class="ctx" id="ctx"><button type="button" id="ctxSpin">회전</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop-veil" id="dropVeil">사진을 놓으면 새 맵이 만들어져요</div>

<script>
(() => {
  'use strict';

  // "다른 이름으로 저장"에 쓸, 아직 아무것도 바뀌지 않은 이 페이지의 원본 (스크립트 맨 처음에 잡아 둔다)
  const PRISTINE_HTML = '<!doctype html>\n' + document.documentElement.outerHTML;

  // 저장한 맵 파일을 열면 여기에 그 맵이 들어 있다 (아래 표시 사이가 저장할 때 바뀐다)
  const EMBEDDED_MAP = /*EMBED_START*/null/*EMBED_END*/;

  /* ---------- 캔버스 ---------- */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let vw = window.innerWidth, vh = window.innerHeight, dpr = 1;

  /* ---------- 상태 ---------- */
  const SPAWN = 'spawn';        // 선택 목록에서 스폰 지점을 가리키는 표시
  const player = { x: 0, y: 0, z: 0, vz: 0, onGround: true };
  const cam = { x: 0, y: 0 };
  const keys = Object.create(null);
  const pointer = { x: 0, y: 0, inside: false };
  let map = null;               // { img, WW, WH, base, blob, photoName, uid }
  let sizeScale = 1;
  let zoom = DEFAULT_ZOOM;
  let dance = false;
  let danceStart = 0;
  let moving = false;
  let posture = 'stand';        // 'stand' | 'crouch' | 'sit'
  let deadTimer = 0;            // 0보다 크면 죽어서 누워 있는 중
  let showHitbox = false;
  let snapCamera = true;

  let editMode = false;
  let tool = 'select';
  // { id, type: 'wall' | 'hazard' | 'text' | 'image', x, y, w, h, color, (text: text, size) (image: asset, aspect) }
  let obstacles = [];
  let spawn = { x: 0, y: 0, color: null };   // 발 위치
  let sel = new Set();          // 고른 것들 (+ SPAWN)
  let drag = null;
  let nextId = 1;
  let invuln = 0;
  let flash = 0;

  let assets = {};              // 넣은 이미지 { 아이디: 데이터 주소 }
  const assetImgs = {};         // 그려 쓰려고 불러온 이미지
  let armedAsset = null;        // 이미지 도구로 놓을 이미지 { id, aspect }
  let assetSeq = 0;

  let clipboard = [];
  let pasteCount = 0;
  const undoStack = [];
  const redoStack = [];
  let curColor = '#7a5230';
  let liveBefore = null;
  let liveTextBefore = null;
  let liveSizeBefore = null;
  let gravityOn = false, spinT = 0, tpCool = 0, pendingTele = null, pendingBefore = null, liveRotBefore = null;
  const SPIN_DPS = 120;                                   // 플레이 중 회전 속도 (초당 도)
  const DEF_MODE = { triangle: 'hazard', circle: 'wall', star: 'pass' };
  const ROT_TYPES = new Set(['wall', 'hazard', 'triangle', 'circle', 'star']);
  const isShapeT = (t) => t === 'triangle' || t === 'circle' || t === 'star';
  const modeOf = (o) => (o.type === 'wall' || o.type === 'hazard') ? o.type : (isShapeT(o.type) ? (o.mode || 'pass') : 'pass');
  const angOf = (o) => (o.rot || 0) + (o.spin && !editMode ? spinT * SPIN_DPS : 0);
  const defaultColor = (m) => m === 'wall' ? '#2b5fd9' : m === 'hazard' ? '#d21f1f' : '#f2c94c';
  function polyOf(o) {
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2, a = angOf(o) * Math.PI / 180, hw = o.w / 2, hh = o.h / 2;
    let p;
    if (o.type === 'triangle') p = [[0, -hh], [hw, hh], [-hw, hh]];
    else if (o.type === 'circle' || o.type === 'tele') { p = []; for (let i = 0; i < 32; i++) { const t = i / 32 * 6.2832; p.push([Math.cos(t) * hw, Math.sin(t) * hh]); } }
    else if (o.type === 'star') { p = []; for (let i = 0; i < 10; i++) { const t = -Math.PI / 2 + i * Math.PI / 5, k = i % 2 ? 0.4 : 1; p.push([Math.cos(t) * hw * k, Math.sin(t) * hh * k]); } }
    else p = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
    const c = Math.cos(a), sn = Math.sin(a);
    return p.map(([x, y]) => [cx + x * c - y * sn, cy + x * sn + y * c]);
  }
  function inPoly(P, x, y) {
    let c = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const [xi, yi] = P[i], [xj, yj] = P[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  function segX(a, b, c, d) {
    const o = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
    return (o(a, b, c) > 0) !== (o(a, b, d) > 0) && (o(c, d, a) > 0) !== (o(c, d, b) > 0);
  }
  function polyRectHit(P, r) {
    for (const [x, y] of P) if (x > r.l && x < r.r && y > r.t && y < r.b) return true;
    const cs = [[r.l, r.t], [r.r, r.t], [r.r, r.b], [r.l, r.b]];
    if (cs.some(([x, y]) => inPoly(P, x, y))) return true;
    for (let i = 0; i < P.length; i++) for (let j = 0; j < 4; j++) if (segX(P[i], P[(i + 1) % P.length], cs[j], cs[(j + 1) % 4])) return true;
    return false;
  }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const isSolidType = (t) => t === 'wall' || t === 'hazard';   // 글자와 이미지는 지나갈 수 있다
  // 캐릭터는 확대 배율과 관계없이 화면에서 같은 크기로 보이도록 월드 크기를 나눠 준다
  const charH = () => map.base * sizeScale / zoom;
  const viewScale = () => Math.min(vw / map.WW, vh / map.WH) * zoom;

  function clampPoint(p) {
    const ch = charH();
    const half = 0.24 * ch;
    p.x = clamp(p.x, half, map.WW - half);
    p.y = clamp(p.y, Math.min(ch, map.WH), map.WH);
  }
  const defaultSpawn = () => ({ x: map.WW / 2, y: map.WH / 2, color: null });

  function respawn() {
    player.x = spawn.x; player.y = spawn.y;
    player.z = 0; player.vz = 0; player.vy = 0; player.onGround = true;
    clampPoint(player);
    snapCamera = true;
  }

  function hexToRgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function hexLuma(hex) {

  }

    : 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

  /* ---------- 히트 박스 (그림 크기 그대로) ---------- */
  // pose: 'idle' | 'jump' | 'sit' | 'crouch' | 'dead'. 발 위치(x, y)를 기준으로 그림이 놓이는 사각형을 돌려준다.
  // 점프 그림은 서 있을 때 머리 위치에 맞춰 그려지고, 점프한 높이(z)만큼 캐릭터와 함께 올라간다.
  function rectFor(pose, x, y, z) {
    const ch = charH();
    const k = ch / SPRITE_DIM.idle[1];
    const w = SPRITE_DIM[pose][0] * k, h = SPRITE_DIM[pose][1] * k;
    const top = pose === 'jump' ? y - ch - (z || 0) * ch : y - h;
    return { l: x - w / 2, r: x + w / 2, t: top, b: top + h };
  }
  function hitPose() {
    if (deadTimer > 0) return 'dead';
    if (!player.onGround) return 'jump';
    if (posture === 'sit') return 'sit';
    if (posture === 'crouch') return 'crouch';
    return 'idle';
  }
  const playerRect = () => rectFor(hitPose(), player.x, player.y, player.z);

  const rectHits = (r, o) => (o.rot || o.spin || isShapeT(o.type))
    ? polyRectHit(polyOf(o), r)
    : (r.l < o.x + o.w && r.r > o.x && r.t < o.y + o.h && r.b > o.y);
  function hitsRect(type, r) {
    for (const o of obstacles) if (modeOf(o) === type && rectHits(r, o)) return true;
    return false;
  }
  // 벽과 겹치는 넓이의 합 (0이면 겹치지 않음)
  function wallOverlapArea(r) {
    let a = 0;
    for (const o of obstacles) {
      if (modeOf(o) !== 'wall') continue;
      if (o.rot || o.spin || isShapeT(o.type)) { if (polyRectHit(polyOf(o), r)) a += 1; continue; }
      const w = Math.min(r.r, o.x + o.w) - Math.max(r.l, o.x);
      const h = Math.min(r.b, o.y + o.h) - Math.max(r.t, o.y);
      if (w > 0 && h > 0) a += w * h;
    }
    if (gravityOn && !editMode) {                       // 중력 모드에서는 스폰 지점도 밟고 설 수 있는 단단한 바닥
      const ch = charH(), l = spawn.x - 0.3 * ch, rr = spawn.x + 0.3 * ch, t = spawn.y, b = spawn.y + 0.06 * ch;
      const w = Math.min(r.r, rr) - Math.max(r.l, l), h = Math.min(r.b, b) - Math.max(r.t, t);
      if (w > 0 && h > 0) a += w * h;

  }

  // 자세가 바뀌어 히트 박스가 커질 때, 벽과 겹치지 않는 x 위치를 찾는다.
  // 벽에 바짝 붙어 있어 조금만 비키면 되면 비켜 주고, 그래도 안 되면 null (자세를 바꾸지 않는다).
  function fitX(pose, x, y) {
    if (editMode) return x;                          // 편집 모드에서는 벽이 막지 않는다
    const r = rectFor(pose, x, y);
    if (wallOverlapArea(r) === 0) return x;
    const maxNudge = 0.12 * charH();
    const shifts = [];
    for (const o of obstacles) {
      if (modeOf(o) !== 'wall' || !rectHits(r, o)) continue;
      shifts.push(o.x - r.r - 0.01, o.x + o.w - r.l + 0.01);
    }
    shifts.sort((a, b) => Math.abs(a) - Math.abs(b));
    for (const s of shifts) {
      if (Math.abs(s) > maxNudge) break;
      if (wallOverlapArea(rectFor(pose, x + s, y)) === 0) return x + s;
    }
    return null;
  }

  // 점프하는 동안 히트 박스가 위로 올라가 있어서, 벽 쪽으로 뛰어 착지하면 서 있는 몸이 벽과 겹칠 수 있다.
  // 그럴 때는 가장 가까운 빈 자리로 밀어낸다.
  function depenetrate(pose) {
    if (editMode) return;
    const r = rectFor(pose, player.x, player.y, 0);
    if (wallOverlapArea(r) === 0) return;
    const cands = [];
    for (const o of obstacles) {
      if (modeOf(o) !== 'wall' || !rectHits(r, o)) continue;
      cands.push([o.x - r.r - 0.01, 0], [o.x + o.w - r.l + 0.01, 0], [0, o.y - r.b - 0.01], [0, o.y + o.h - r.t + 0.01]);
    }

      const cx = p.x, cy = p.y;

    }
  }

  function desiredPosture() {
    if (keys.KeyX) return 'sit';
    if (keys.ShiftLeft || keys.ShiftRight) return 'crouch';

  }

    const want = desiredPosture();
    if (want === posture) return;
    const order = ['stand', 'crouch', 'sit'].filter((p) => POSTURE_RANK[p] <= POSTURE_RANK[want]);
    for (const p of order) {
      if (p === posture) return;                     // 현재 자세가 가장 큰 후보 → 그대로
      const nx = fitX(p === 'stand' ? 'idle' : p, player.x, player.y);

    }
  }

  /* ---------- 글자와 이미지 ---------- */
  // 글자 상자의 크기를 글자 내용과 크기에 맞춘다
  function layoutText(o) {
    const lines = String(o.text == null ? '' : o.text).split('\n');
    ctx.save();
    ctx.font = '700 100px ' + FONT;
    let mw = 0;
    for (const ln of lines) mw = Math.max(mw, ctx.measureText(ln).width);
    ctx.restore();
    o.w = Math.max(mw * o.size / 100, o.size * 0.8);
    o.h = Math.max(lines.length, 1) * o.size * 1.25;
  }
  function fitInMap(o) {
    o.x = clamp(o.x, 0, Math.max(0, map.WW - o.w));
    o.y = clamp(o.y, 0, Math.max(0, map.WH - o.h));
  }
  function assetImg(id) {
    if (!assetImgs[id] && assets[id]) {
      const im = new Image();
      im.src = assets[id];
      assetImgs[id] = im;
    }
    return assetImgs[id];
  }
  function usedAssets() {
    const out = {};
    for (const o of obstacles) if (o.type === 'image' && assets[o.asset]) out[o.asset] = assets[o.asset];
    return out;
  }

  async function addImageAsset(file) {
    if (!file) return;
    if (!file.type || !file.type.startsWith('image/')) { toast('이미지 파일만 넣을 수 있어요.'); return; }
    try {
      const raw = await readAsDataURL(file);
      let img = await loadImage(raw);
      let url = raw;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const longest = Math.max(iw, ih);
      if (longest > MAX_ASSET_SIDE || file.size > 1500000) {   // 크면 줄여서 저장한다
        const r = Math.min(1, MAX_ASSET_SIDE / longest);
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(iw * r));
        c.height = Math.max(1, Math.round(ih * r));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        url = c.toDataURL('image/webp', 0.9);
        img = await loadImage(url);

      assets[id] = url;
      assetImgs[id] = img;
      armedAsset = { id, aspect: iw / ih };
    } catch (err) {
      toast('이 이미지는 열 수 없어요.');
    }
  }

  /* ---------- 맵 ---------- */
  function setMap(source, iw, ih, meta) {
    const f0 = Math.min(REF_W / iw, REF_H / ih);
    const WW = iw * f0, WH = ih * f0;
    map = {
      img: source, WW, WH, base: 0.2 * Math.min(WW, WH),

    };

  // 저장된 배치(장애물·스폰·이미지)를 지금 맵에 넣는다
  function applyLayout(o, s, a, g) {
    setGravity(!!g);
    obstacles = Array.isArray(o) ? o : [];

  function makeDefaultMap() {

    return c;

  const defaultMapCanvas = makeDefaultMap();

  /* ---------- 저장 (브라우저 IndexedDB: 자동 저장) ---------- */
  let db = null;
  let storageOK = false;
  let mapList = [];             // { id, name, fileName(사진 이름), created, uid, saved }
  let currentId = null;         // 저장된 맵을 열고 있으면 그 id, 기본 모눈종이면 null
  let saveTimer = 0;
  let fileHandle = null;        // "저장"으로 덮어쓸 실제 파일
  let scratchFile = '';         // 기본 모눈종이를 파일로 저장했을 때의 파일 이름

  const readAsDataURL = (blob) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);

  const loadImage = (src) => new Promise((res, rej) => {

    im.onerror = () => rej(new Error('image'));

  const canvasToBlob = (c) => new Promise((res) => c.toBlob((b) => res(b), 'image/webp', 0.92));
  function dataURLToBlob(url) {
    const m = /^data:([^;,]*)(;base64)?,([\s\S]*)$/.exec(url);
    if (!m) return null;
    const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: m[1] || 'application/octet-stream' });
  }

  function openDB() {
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open('stickman-photo-walk', 2); } catch (err) { rej(err); return; }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('maps')) d.createObjectStore('maps', { keyPath: 'id' });       // 사진
        if (!d.objectStoreNames.contains('layouts')) d.createObjectStore('layouts', { keyPath: 'id' }); // 벽·즉사·스폰·색·글자·이미지
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
        if (!d.objectStoreNames.contains('handles')) d.createObjectStore('handles');                    // "저장"할 실제 파일
      };
      req.onsuccess = () => {
        const d = req.result;
        d.onversionchange = () => d.close();            // 다른 탭이 새 버전으로 올릴 때 막지 않는다
        res(d);
      };
      req.onerror = () => rej(req.error);
      // onblocked: 옛 버전을 연 다른 탭이 닫히면 이어서 진행된다 (아래 initStorage에서 오래 걸리면 저장 없이 시작)
    });
  }
  function tx(stores, mode, fn) {
    return new Promise((res, rej) => {
      const t = db.transaction(stores, mode);
      const names = Array.isArray(stores) ? stores : [stores];
      let out;
      const r = fn(...names.map((n) => t.objectStore(n)));
      if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }

  function markDirty() {
    if (!storageOK || currentId === null) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCurrent, SAVE_DELAY_MS);
  }
  async function saveCurrent() {
    clearTimeout(saveTimer);
    saveTimer = 0;
    if (!storageOK || currentId === null || !map) return;
    const id = currentId;
    const o = JSON.parse(JSON.stringify(obstacles));
    const s = { x: spawn.x, y: spawn.y, color: spawn.color || null };
    const a = usedAssets();
    try { await tx('layouts', 'readwrite', (st) => st.put({ id, o, s, a, g: gravityOn, updated: Date.now() })); }
    catch (err) { toast('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.'); }
  }

  function nextMapNumber() {
    let m = 0;
    for (const it of mapList) {
      const r = /^맵 (\d+)$/.exec(it.name);
      if (r) m = Math.max(m, parseInt(r[1], 10));
    }
    return m + 1;
  }

  async function refreshMapList() {
    const all = await tx('maps', 'readonly', (st) => st.getAll());
    mapList = (all || []).map((m) => ({ id: m.id, name: m.name, fileName: m.fileName || '', created: m.created, uid: m.uid || '', saved: !!m.saved }))
      .sort((a, b) => a.created - b.created);
  }

  function showScratch() {
    setMap(defaultMapCanvas, defaultMapCanvas.width, defaultMapCanvas.height);
    currentId = null;
    fileHandle = null;
    scratchFile = '';
    if (storageOK) tx('meta', 'readwrite', (st) => st.put(null, 'lastId')).catch(() => {});
    updateMapUI();
  }

  async function openSavedMap(id) {
    await saveCurrent();
    let rec, lay, handle = null;
    try {
      rec = await tx('maps', 'readonly', (st) => st.get(id));
      lay = await tx('layouts', 'readonly', (st) => st.get(id));
      handle = await tx('handles', 'readonly', (st) => st.get(id)).catch(() => null);
    } catch (err) { toast('맵을 불러오지 못했어요.'); return; }
    if (!rec) { await refreshMapList(); updateMapUI(); return; }
    let img = defaultMapCanvas, iw = defaultMapCanvas.width, ih = defaultMapCanvas.height;
    if (rec.blob) {
      try { img = await loadImage(await readAsDataURL(rec.blob)); }
      catch (err) { toast('저장된 사진을 열 수 없어요.'); return; }
      iw = img.naturalWidth || rec.iw; ih = img.naturalHeight || rec.ih;
    }
    let uid = rec.uid;
    if (!uid) {                                         // 예전에 만든 맵에는 아이디를 붙여 둔다
      uid = newUid();
      rec.uid = uid;
      tx('maps', 'readwrite', (st) => st.put(rec)).catch(() => {});
    }
    setMap(img, iw, ih, { blob: rec.blob, photoName: rec.fileName, uid });
    currentId = id;
    fileHandle = handle || null;
    scratchFile = '';
    if (lay) applyLayout(lay.o, lay.s, lay.a, lay.g);
    tx('meta', 'readwrite', (st) => st.put(id, 'lastId')).catch(() => {});
    updateMapUI();
  }

  async function createMapFromFile(file) {
    if (!file) return;
    if (!file.type || !file.type.startsWith('image/')) {
      toast('이미지 파일만 맵으로 쓸 수 있어요.');
      return;
    }
    let img;
    try { img = await loadImage(await readAsDataURL(file)); }
    catch (err) { toast('이 사진은 열 수 없어요. JPG, PNG, WEBP 같은 파일을 골라 주세요.'); return; }

    let src = img, iw = img.naturalWidth, ih = img.naturalHeight, blob = file;
    const longest = Math.max(iw, ih);
    if (longest > MAX_MAP_SIDE) {                       // 너무 큰 사진은 줄여서 쓰고 저장한다
      const r = MAX_MAP_SIDE / longest;
      const c = document.createElement('canvas');
      c.width = Math.round(iw * r);
      c.height = Math.round(ih * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      blob = (await canvasToBlob(c)) || file;
      src = c; iw = c.width; ih = c.height;
    }

    await saveCurrent();                                // 지금 열려 있던 맵의 변경부터 저장
    const uid = newUid();
    setMap(src, iw, ih, { blob, photoName: file.name, uid });
    currentId = null;
    fileHandle = null;
    scratchFile = '';
    if (storageOK) {
      try {
        const id = Date.now();
        const name = '맵 ' + nextMapNumber();
        await tx('maps', 'readwrite', (st) => st.put({ id, name, fileName: file.name, blob, iw, ih, created: id, uid, saved: false }));
        await tx('layouts', 'readwrite', (st) => st.put({ id, o: [], s: { x: spawn.x, y: spawn.y, color: null }, a: {}, updated: id }));
        await tx('meta', 'readwrite', (st) => st.put(id, 'lastId'));
        mapList.push({ id, name, fileName: file.name, created: id, uid, saved: false });
        currentId = id;
      } catch (err) {
        toast('사진은 불러왔지만 저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.');
      }
    }
    updateMapUI();
  }

  async function deleteCurrentMap() {
    const id = currentId;
    if (id === null) return;
    clearTimeout(saveTimer);
    try { await tx(['maps', 'layouts', 'handles'], 'readwrite', (m, l, h) => { m.delete(id); l.delete(id); h.delete(id); }); }
    catch (err) { toast('맵을 지우지 못했어요.'); return; }
    mapList = mapList.filter((m) => m.id !== id);
    currentId = null;
    const next = mapList[mapList.length - 1];
    if (next) await openSavedMap(next.id); else showScratch();
  }

  // 저장한 맵 파일(HTML)을 열었을 때: 그 안에 든 맵을 불러온다
  async function openEmbedded(emb) {
    let img = null, blob = null, iw = REF_W, ih = REF_H;
    if (emb.photo) {
      try {
        blob = dataURLToBlob(emb.photo);
        img = await loadImage(emb.photo);
        iw = img.naturalWidth; ih = img.naturalHeight;
      } catch (err) { toast('맵 파일 안의 사진을 열 수 없어요.'); }
    }
    const label = pathLabel() || emb.name || '맵';
    const uid = emb.uid || newUid();
    if (storageOK) {
      try {
        // 같은 맵(아이디가 같은 것)이 이미 저장돼 있으면 파일에 든 내용으로 바꾼다
        const existing = mapList.find((m) => m.uid && m.uid === uid);
        const id = existing ? existing.id : Date.now();
        await tx('maps', 'readwrite', (st) => st.put({ id, name: label, fileName: emb.photoName || '', blob, iw, ih, created: existing ? existing.created : id, uid, saved: true }));
        await tx('layouts', 'readwrite', (st) => st.put({ id, o: emb.o || [], s: emb.s || null, a: emb.a || {}, g: !!emb.g, updated: Date.now() }));
        await refreshMapList();
        await openSavedMap(id);
        return;
      } catch (err) { /* 아래처럼 저장 없이 연다 */ }
    }
    setMap(img || defaultMapCanvas, iw, ih, { blob, photoName: emb.photoName || '', uid });
    applyLayout(emb.o, emb.s, emb.a, emb.g);
    currentId = null;
    scratchFile = label;
    updateMapUI();
  }

  async function initStorage() {
    try {
      db = await Promise.race([
        openDB(),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000))
      ]);
      storageOK = true;
      await refreshMapList();
    } catch (err) {
      storageOK = false;
      if (EMBEDDED_MAP) await openEmbedded(EMBEDDED_MAP); else updateMapUI();
      return;
    }
    if (EMBEDDED_MAP) { await openEmbedded(EMBEDDED_MAP); return; }
    let lastId = null;
    try { lastId = await tx('meta', 'readonly', (st) => st.get('lastId')); } catch (err) { /* 무시 */ }
    const target = mapList.find((m) => m.id === lastId) || mapList[mapList.length - 1];
    if (target && currentId === null) await openSavedMap(target.id);
    else updateMapUI();
  }

  window.addEventListener('pagehide', () => { saveCurrent(); });

  /* ---------- 파일로 저장 (저장 / 다른 이름으로 저장) ---------- */
  // 파일을 연 위치와 이름 (파일로 열었을 때만 알 수 있다)
  function pathLabel() {
    if (location.protocol !== 'file:') return '';
    let p;
    try { p = decodeURIComponent(location.pathname); } catch (err) { p = location.pathname; }
    if (/^\/[A-Za-z]:/.test(p)) p = p.slice(1).replace(/\//g, '\\');
    return p;
  }
  const baseName = (s) => String(s || '').split(/[\\/]/).pop();

  function currentMapName() {
    if (currentId === null) return scratchFile || '기본 맵';
    const cur = mapList.find((m) => m.id === currentId);
    return cur ? cur.name : '맵';
  }
  function suggestName() {
    let n = baseName(currentMapName()).replace(/[\\/:*?"<>|]/g, '_').trim() || '맵';
    if (!/\.html?$/i.test(n)) n += '.html';
    return n;
  }

  async function buildMapHTML() {
    const data = {
      v: 1,
      uid: map.uid,
      name: baseName(currentMapName()),
      savedAt: Date.now(),
      photoName: map.photoName || '',
      photo: map.blob ? await readAsDataURL(map.blob) : null,
      o: JSON.parse(JSON.stringify(obstacles)),
      s: { x: spawn.x, y: spawn.y, color: spawn.color || null },
      a: usedAssets(),
      g: gravityOn
    };
    const json = JSON.stringify(data)
      .replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
    const a = PRISTINE_HTML.indexOf(EMB_START);
    const b = PRISTINE_HTML.indexOf(EMB_END, a + 1);
    if (a < 0 || b < 0) throw new Error('marker');
    return PRISTINE_HTML.slice(0, a + EMB_START.length) + json + PRISTINE_HTML.slice(b);
  }

  async function ensureWritable(h) {
    if (!h || !h.createWritable) return false;
    if (!h.queryPermission) return true;
    try {
      let p = await h.queryPermission({ mode: 'readwrite' });
      if (p !== 'granted') p = await h.requestPermission({ mode: 'readwrite' });
      return p === 'granted';
    } catch (err) { return false; }
  }
  async function writeHandle(h, blob) {
    const w = await h.createWritable();
    await w.write(blob);
    await w.close();
  }
  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // 저장이 끝나면 맵 이름을 저장한 파일 이름으로 바꿔 보여 준다
  async function afterFileSaved(name, handle) {
    fileHandle = handle && handle.createWritable ? handle : null;
    if (storageOK && currentId !== null) {
      try {
        const rec = await tx('maps', 'readonly', (st) => st.get(currentId));
        if (rec) {
          rec.name = name; rec.saved = true; rec.uid = map.uid;
          await tx('maps', 'readwrite', (st) => st.put(rec));
        }
        if (fileHandle) await tx('handles', 'readwrite', (st) => st.put(fileHandle, currentId)).catch(() => {});
        await refreshMapList();
      } catch (err) { /* 파일은 이미 저장됨 */ }
    } else {
      scratchFile = name;
    }
    updateMapUI();
  }

  let savingFile = false;
  async function saveFile(forceDialog) {
    if (!map || savingFile) return;
    savingFile = true;
    try {
      await saveCurrent();
      let html;
      try { html = await buildMapHTML(); }
      catch (err) { toast('파일로 저장하지 못했어요.'); return; }
      const blob = new Blob([html], { type: 'text/html' });

      // 저장: 이미 정한 파일이 있으면 창 없이 덮어쓴다
      if (!forceDialog && fileHandle && await ensureWritable(fileHandle)) {
        try { await writeHandle(fileHandle, blob); await afterFileSaved(fileHandle.name, fileHandle); return; }
        catch (err) { fileHandle = null; }
      }
      // 다른 이름으로 저장 (또는 처음 저장): 파일 저장 창을 띄운다
      if (window.showSaveFilePicker) {
        let h;
        try {
          h = await window.showSaveFilePicker({
            suggestedName: suggestName(),
            types: [{ description: 'HTML 파일', accept: { 'text/html': ['.html'] } }]
          });
        } catch (err) {
          if (err && err.name === 'AbortError') return;           // 창에서 취소
          const n = suggestName();
          downloadBlob(blob, n);                                    // 이 환경에서는 창을 못 띄움 → 내려받기
          await afterFileSaved(n, null);
          return;
        }
        try { await writeHandle(h, blob); }
        catch (err) { toast('파일로 저장하지 못했어요.'); return; }
        await afterFileSaved(h.name, h);
      } else {
        const n = suggestName();
        downloadBlob(blob, n);                                      // 창을 지원하지 않는 브라우저 → 내려받기
        await afterFileSaved(n, null);
      }
    } finally {
      savingFile = false;
    }
  }

  /* ---------- 되돌리기 / 다시 실행 ---------- */
  const snapshot = () => JSON.stringify({ o: obstacles, s: spawn });

  // 편집 동작 전에 찍어 둔 상태(before)와 지금이 다르면 되돌리기 목록에 넣고 저장한다
  function commit(before) {
    if (before === null || before === snapshot()) return;
    undoStack.push(before);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack.length = 0;
    markDirty();
  }

  function restore(str) {
    const keep = new Set(Array.from(sel, (it) => (it === SPAWN ? SPAWN : it.id)));
    const s = JSON.parse(str);
    obstacles = s.o;
    spawn = s.s;
    sel = new Set();
    if (keep.has(SPAWN)) sel.add(SPAWN);
    for (const o of obstacles) if (keep.has(o.id)) sel.add(o);
    drag = null;
    markDirty();
    updateCursor();
  }

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
  }

  /* ---------- 복사 / 붙여넣기 / 전체 선택 / 삭제 ---------- */
  function selectAll() {
    sel = new Set(obstacles);
    sel.add(SPAWN);
  }

  function copySel() {
    const objs = Array.from(sel).filter((it) => it !== SPAWN);
    if (!objs.length) return;                          // 스폰 지점은 하나뿐이라 복사하지 않는다
    clipboard = objs.map((o) => JSON.parse(JSON.stringify(o)));
    pasteCount = 0;
  }

  function pasteClipboard() {
    if (!clipboard.length) return;
    const before = snapshot();
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const o of clipboard) {
      minX = Math.min(minX, o.x); minY = Math.min(minY, o.y);
      maxX = Math.max(maxX, o.x + o.w); maxY = Math.max(maxY, o.y + o.h);
    }
    let dx, dy;
    if (pointer.inside) {                         // 마우스가 화면 위에 있으면 그 자리에 붙인다
      const c = pointerWorld();
      dx = c.x - (minX + maxX) / 2;
      dy = c.y - (minY + maxY) / 2;
    } else {
      pasteCount++;
      dx = dy = 0.4 * charH() * pasteCount;
    }
    dx = clamp(dx, -minX, map.WW - maxX);
    dy = clamp(dy, -minY, map.WH - maxY);
    const added = clipboard.map((o) => Object.assign(JSON.parse(JSON.stringify(o)), { id: nextId++, x: o.x + dx, y: o.y + dy }));
    obstacles.push(...added);
    sel = new Set(added);
    commit(before);
    warnIfSpawnBlocked();
  }

  function deleteSelected() {
    if (!editMode || !sel.size) return;
    drag = null;
    const before = snapshot();
    const hadSpawn = sel.has(SPAWN);
    obstacles = obstacles.filter((o) => !sel.has(o));
    if (hadSpawn) spawn = defaultSpawn();
    sel = new Set();
    commit(before);
    updateCursor();
  }

  /* ---------- 색 입히기 (글자는 글자 색) ---------- */
  function setColorOnSel(color) {
    for (const it of sel) {
      if (it === SPAWN) spawn.color = color;
      else if (it.type !== 'image') it.color = color;
    }
  }
  function paintSelection(color) {
    if (!sel.size) return;
    const before = snapshot();
    setColorOnSel(color);
    commit(before);
  }

  /* ---------- 이동과 충돌 ---------- */
  function movePlayer(mx, my) {
    const pose = hitPose();
    const solid = !editMode;                       // 벽은 플레이 모드에서만 막는다
    const r0 = rectFor(pose, player.x, player.y, player.z);
    const minDim = Math.min(r0.r - r0.l, r0.b - r0.t);
    const dist = Math.max(Math.abs(mx), Math.abs(my));
    const steps = Math.max(1, Math.ceil(dist / Math.max(1, minDim * 0.25)));
    const sx = mx / steps, sy = my / steps;

    // 벽 안으로 더 파고드는 이동만 막는다 (이미 겹쳐 있으면 빠져나가는 방향만 허용)
    const ok = (x, y) => {
      if (!solid) return true;
      const a = wallOverlapArea(rectFor(pose, x, y, player.z));
      return a === 0 || a <= wallOverlapArea(rectFor(pose, player.x, player.y, player.z));
    };
    // 막히면 걸음을 반씩 줄여 벽에 딱 붙는다
    const stepAxis = (axis, s) => {
      let d = s;
      for (let i = 0; i < 5; i++) {
        const nx = axis === 'x' ? player.x + d : player.x;
        const ny = axis === 'y' ? player.y + d : player.y;
        if (ok(nx, ny)) { player.x = nx; player.y = ny; return; }
        d /= 2;
      }
    };
    for (let i = 0; i < steps; i++) {
      if (sx) stepAxis('x', sx);
      if (sy) stepAxis('y', sy);
    }
    clampPoint(player);
  }

  function tryJump() {
    if (!map || deadTimer > 0 || !player.onGround || posture !== 'stand') return;
    if (gravityOn && !editMode) { player.vy = -JUMP_V0 * 1.4; player.onGround = false; return; }
    const nx = fitX('jump', player.x, player.y);     // 벽에 붙어 있으면 살짝 비켜서 뛴다
    if (nx === null) return;
    player.x = nx;
    player.onGround = false;
    player.vz = JUMP_V0;
  }

  // 죽으면 그 자리에서 죽은 자세로 누워 있다가 DEAD_SEC 뒤에 스폰 지점에서 다시 시작한다
  function die() {
    flash = 1;
    deadTimer = DEAD_SEC;
    player.z = 0; player.vz = 0; player.vy = 0; player.onGround = true;
    posture = 'stand';
    moving = false;
  }

  function warnIfSpawnBlocked() {
    const r = rectFor('idle', spawn.x, spawn.y);
    if (hitsRect('hazard', r)) toast('스폰 지점에서 서면 즉사 구역과 겹쳐요. 다른 곳으로 옮겨 주세요.');
    else if (wallOverlapArea(r) > 0) toast('스폰 지점에서 서면 벽과 겹쳐요. 다른 곳으로 옮겨 주세요.');
  }

  /* ---------- 편집: 좌표와 잡기 ---------- */
  function pointerWorld() {
    const S = viewScale();
    return { x: pointer.x / S + cam.x, y: pointer.y / S + cam.y };
  }
  const cornersOf = (o) => [[o.x, o.y], [o.x + o.w, o.y], [o.x, o.y + o.h], [o.x + o.w, o.y + o.h]];

  // 하나만 골랐을 때 그 대상 (스폰 지점이면 null)
  function soleObstacle() {
    if (sel.size !== 1) return null;
    const it = sel.values().next().value;
    return it === SPAWN ? null : it;
  }
  // 크기 조절 손잡이를 보여 줄 대상 (글자는 크기를 따로 조절한다)
  function resizableSole() {
    const o = tool === 'select' ? soleObstacle() : null;
    return o && o.type !== 'text' && o.type !== 'tele' && !o.rot ? o : null;
  }

  function hitTest(wx, wy) {
    const S = viewScale(), hp = HANDLE_PX / S, ch = charH();
    const sole = resizableSole();
    if (sole) {
      const cs = cornersOf(sole);
      for (let i = 0; i < 4; i++) {
        if (Math.abs(wx - cs[i][0]) <= hp && Math.abs(wy - cs[i][1]) <= hp) return { kind: 'handle', obj: sole, corner: i };
      }
    }
    if (Math.abs(wx - spawn.x) <= Math.max(0.3 * ch, hp) && Math.abs(wy - spawn.y) <= Math.max(0.12 * ch, hp)) {
      return { kind: 'spawn' };
    }
    const m = hp * 0.5;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      if (wx >= o.x - m && wx <= o.x + o.w + m && wy >= o.y - m && wy <= o.y + o.h + m) return { kind: 'obj', obj: o };
    }
    return null;
  }

  // 커서 그림: arrow(기본) · hand(누를 수 있는 것) · move(옮기기) · forbid(못 누름). 크기 조절과 그리기는 기본 커서를 쓴다.
  function setCursor(kind) {
    if (kind === 'crosshair' || kind.endsWith('-resize')) { canvas.className = ''; canvas.style.cursor = kind; }
    else { canvas.style.cursor = ''; canvas.className = 'cur-' + kind; }
  }
  function updateCursor() {
    let cur = 'arrow';
    if (editMode && map) {
      if (drag) cur = (drag.mode === 'draw' || drag.mode === 'drawImage') ? 'crosshair' : 'move';
      else if (tool === 'wall' || tool === 'hazard' || tool === 'spawn' || tool === 'text' || tool === 'image') cur = 'crosshair';
      else {
        const c = pointerWorld();
        const h = hitTest(c.x, c.y);
        if (h) {
          if (h.kind === 'handle') cur = (h.corner === 0 || h.corner === 3) ? 'nwse-resize' : 'nesw-resize';
          else cur = tool === 'paint' ? 'hand' : 'move';
        }
      }
    }
    setCursor(cur);
  }

  function applyDrag() {
    const c = pointerWorld();
    const o = drag.obj;
    if (drag.mode === 'draw') {
      const px = clamp(c.x, 0, map.WW), py = clamp(c.y, 0, map.WH);
      o.x = Math.min(drag.ax, px); o.y = Math.min(drag.ay, py);
      o.w = Math.abs(px - drag.ax); o.h = Math.abs(py - drag.ay);
    } else if (drag.mode === 'drawImage') {           // 이미지는 가로세로 비율을 지켜서 그린다
      const px = clamp(c.x, 0, map.WW), py = clamp(c.y, 0, map.WH);
      const w = Math.abs(px - drag.ax), h = w / o.aspect;
      o.w = w; o.h = h;
      o.x = px < drag.ax ? drag.ax - w : drag.ax;
      o.y = py < drag.ay ? drag.ay - h : drag.ay;
    } else if (drag.mode === 'place') {               // 새 글자를 놓으면서 끌어 위치를 정한다
      o.x = clamp(c.x, 0, Math.max(0, map.WW - o.w));
      o.y = clamp(c.y, 0, Math.max(0, map.WH - o.h));
    } else if (drag.mode === 'move') {
      // 고른 것들을 한꺼번에 옮기되, 하나라도 사진 밖으로 나가지 않게 한다
      const ch = charH(), half = 0.24 * ch;
      let loX = -Infinity, hiX = Infinity, loY = -Infinity, hiY = Infinity;
      for (const it of drag.items) {
        let minX, maxX, minY, maxY;
        if (it.ref === SPAWN) { minX = half; maxX = map.WW - half; minY = Math.min(ch, map.WH); maxY = map.WH; }
        else { minX = 0; maxX = map.WW - it.ref.w; minY = 0; maxY = map.WH - it.ref.h; }
        loX = Math.max(loX, Math.min(minX - it.ox, 0)); hiX = Math.min(hiX, Math.max(maxX - it.ox, 0));
        loY = Math.max(loY, Math.min(minY - it.oy, 0)); hiY = Math.min(hiY, Math.max(maxY - it.oy, 0));
      }
      const dx = clamp(c.x - drag.sx, loX, hiX), dy = clamp(c.y - drag.sy, loY, hiY);
      for (const it of drag.items) {
        if (it.ref === SPAWN) { spawn.x = it.ox + dx; spawn.y = it.oy + dy; }
        else { it.ref.x = it.ox + dx; it.ref.y = it.oy + dy; if (it.otx != null) { it.ref.tx = it.otx + dx; it.ref.ty = it.oty + dy; } }
      }
    } else if (drag.mode === 'resize') {
      const px = clamp(c.x, 0, map.WW), py = clamp(c.y, 0, map.WH);
      o.w = Math.max(Math.abs(px - drag.fx), MIN_SIZE);
      o.h = Math.max(Math.abs(py - drag.fy), MIN_SIZE);
      o.x = Math.min(Math.min(drag.fx, px), map.WW - o.w);
      o.y = Math.min(Math.min(drag.fy, py), map.WH - o.h);
    } else if (drag.mode === 'resizeImage') {         // 이미지는 비율을 지켜서 크기를 바꾼다
      const px = clamp(c.x, 0, map.WW), py = clamp(c.y, 0, map.WH);
      const w = Math.max(Math.abs(px - drag.fx), MIN_SIZE), h = w / o.aspect;
      o.w = w; o.h = h;
      o.x = clamp(px < drag.fx ? drag.fx - w : drag.fx, 0, Math.max(0, map.WW - w));
      o.y = clamp(py < drag.fy ? drag.fy - h : drag.fy, 0, Math.max(0, map.WH - h));
    } else if (drag.mode === 'spawn') {
      spawn.x = c.x + drag.ox; spawn.y = c.y + drag.oy;
      clampPoint(spawn);
    }
  }

  function endDrag() {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (d.mode === 'draw') {
      const o = d.obj;
      if (!d.moved) {                                  // 클릭만 했으면 기본 크기로 놓는다
        const side = 0.8 * charH();
        o.w = side; o.h = side;
        o.x = clamp(d.ax - side / 2, 0, map.WW - side);
        o.y = clamp(d.ay - side / 2, 0, map.WH - side);
      } else {
        o.w = Math.max(o.w, MIN_SIZE); o.h = Math.max(o.h, MIN_SIZE);
        o.x = Math.min(o.x, map.WW - o.w); o.y = Math.min(o.y, map.WH - o.h);
      }
    } else if (d.mode === 'drawImage') {
      const o = d.obj;
      if (!d.moved || o.w < MIN_SIZE) {                // 클릭만 했으면 기본 크기로 놓는다
        const box = 2.5 * charH();
        if (o.aspect >= 1) { o.w = box; o.h = box / o.aspect; } else { o.h = box; o.w = box * o.aspect; }
        o.x = d.ax - o.w / 2; o.y = d.ay - o.h / 2;
      }
      fitInMap(o);
    }
    // 여러 개를 고른 상태에서 그냥 클릭만 했다면 클릭한 것 하나만 남긴다
    if (d.mode === 'move' && !d.moved && !d.shift && sel.size > 1) sel = new Set([d.item]);
    commit(d.before);
    warnIfSpawnBlocked();
    updateCursor();
    if (d.mode === 'draw' && ROT_TYPES.has(d.obj.type)) setTool('select');   // 도형을 넣으면 선택으로 바뀐다
    if (d.focusText) {                                 // 새 글자를 놓으면 바로 내용을 쓸 수 있게 한다
      syncUI();
      setTimeout(() => { textInput.focus(); textInput.select(); }, 0);
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!editMode || !map || e.button !== 0 || drag) return;
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true;
    canvas.setPointerCapture(e.pointerId);
    const c = pointerWorld();
    const before = snapshot();
    if (tool === 'select' || tool === 'paint') {
      const h = hitTest(c.x, c.y);
      if (!h) { if (!e.shiftKey) sel = new Set(); return; }
      if (h.kind === 'handle') {
        const o = h.obj;
        const left = h.corner % 2 === 0, top = h.corner < 2;
        drag = { mode: o.type === 'image' ? 'resizeImage' : 'resize', obj: o, fx: left ? o.x + o.w : o.x, fy: top ? o.y + o.h : o.y };
      } else {
        const item = h.kind === 'spawn' ? SPAWN : h.obj;
        if (e.shiftKey) {
          if (sel.has(item)) { sel.delete(item); return; }
          sel.add(item);
        } else if (!sel.has(item)) {
          sel = new Set([item]);
        }
        if (tool === 'select') {
          const items = Array.from(sel, (it) => (it === SPAWN
            ? { ref: SPAWN, ox: spawn.x, oy: spawn.y }
            : { ref: it, ox: it.x, oy: it.y, otx: it.tx, oty: it.ty }));
          drag = { mode: 'move', item, shift: e.shiftKey, sx: c.x, sy: c.y, items };
        }
      }
    } else if (tool === 'spawn') {
      sel = new Set([SPAWN]);
      spawn.x = c.x; spawn.y = c.y;
      clampPoint(spawn);
      drag = { mode: 'spawn', ox: 0, oy: 0 };
    } else if (tool === 'text') {
      const o = { id: nextId++, type: 'text', x: c.x, y: c.y, w: 0, h: 0, text: '글자', size: clamp(0.4 * charH(), 6, 200), color: null };
      layoutText(o);
      o.x = clamp(o.x, 0, Math.max(0, map.WW - o.w));
      o.y = clamp(o.y, 0, Math.max(0, map.WH - o.h));
      obstacles.push(o);
      sel = new Set([o]);
      drag = { mode: 'place', obj: o, focusText: true };
    } else if (tool === 'image') {
      if (!armedAsset) { objImageFile.click(); return; }
      const ax = clamp(c.x, 0, map.WW), ay = clamp(c.y, 0, map.WH);
      const o = { id: nextId++, type: 'image', x: ax, y: ay, w: 0, h: 0, asset: armedAsset.id, aspect: armedAsset.aspect };
      obstacles.push(o);
      sel = new Set([o]);
      drag = { mode: 'drawImage', obj: o, ax, ay };
    } else if (tool === 'tele') {                      // 첫 클릭 = 입구, 두 번째 클릭 = 이동되는 곳
      const px = clamp(c.x, 0, map.WW), py = clamp(c.y, 0, map.WH);
      if (pendingTele) {
        const t = pendingTele;
        t.tx = px; t.ty = py; pendingTele = null;
        sel = new Set([t]);
        commit(pendingBefore);
        setTool('select');
        return;
      }
      const side = 0.6 * charH();
      const o = { id: nextId++, type: 'tele', x: clamp(px - side / 2, 0, map.WW - side), y: clamp(py - side / 2, 0, map.WH - side), w: side, h: side, tx: null, ty: null };
      obstacles.push(o);
      sel = new Set([o]);
      pendingTele = o; pendingBefore = before;
      editHelp.textContent = '이동될 곳을 클릭해 주세요.';
      return;
    } else {
      const ax = clamp(c.x, 0, map.WW), ay = clamp(c.y, 0, map.WH);
      const o = { id: nextId++, type: tool, x: ax, y: ay, w: 0, h: 0, color: null, mode: DEF_MODE[tool] };
      obstacles.push(o);
      sel = new Set([o]);
      drag = { mode: 'draw', obj: o, ax, ay };
    }
    if (drag) { drag.startX = e.clientX; drag.startY = e.clientY; drag.moved = false; drag.before = before; }
    updateCursor();
  });
  canvas.addEventListener('pointermove', (e) => {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true;
    if (drag && !drag.moved && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 4) drag.moved = true;
    if (!drag) updateCursor();
  });
  canvas.addEventListener('pointerleave', () => { pointer.inside = false; });
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  /* ---------- 입력 ---------- */
  const GAME_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'Digit1', 'Numpad1', 'KeyE', 'KeyR', 'KeyX', 'ShiftLeft', 'ShiftRight']);
  const isTyping = (t) => !!t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type === 'text'));

  window.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !e.altKey && e.code === 'KeyS') {       // Ctrl+S 저장, Ctrl+Shift+S 다른 이름으로 저장
      e.preventDefault();
      if (!e.repeat) saveFile(e.shiftKey);
      return;
    }
    if (isTyping(e.target)) return;                    // 글자를 쓰는 중에는 게임 키로 쓰지 않는다
    if (mod && !e.altKey) {
      if (!editMode) return;
      switch (e.code) {
        case 'KeyZ': e.preventDefault(); if (e.shiftKey) redo(); else undo(); break;
        case 'KeyY': e.preventDefault(); redo(); break;
        case 'KeyC': e.preventDefault(); if (!e.repeat) copySel(); break;
        case 'KeyV': e.preventDefault(); if (!e.repeat) pasteClipboard(); break;
        case 'KeyA': e.preventDefault(); if (!e.repeat) selectAll(); break;
      }
      return;
    }
    if (e.altKey) return;
    if (editMode && (e.code === 'Delete' || e.code === 'Backspace')) {
      e.preventDefault();
      if (!e.repeat) deleteSelected();
      return;
    }
    if (!GAME_KEYS.has(e.code)) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'BUTTON' || ae.tagName === 'SUMMARY' || ae.tagName === 'SELECT')) ae.blur();
    e.preventDefault();
    if (e.repeat) return;
    keys[e.code] = true;
    if (e.code === 'Space') tryJump();
    if (e.code === 'Digit1' || e.code === 'Numpad1') toggleDance();
    if (e.code === 'KeyE' && !PLAY_ONLY) setEditMode(!editMode);
    if (e.code === 'KeyR') setShowHitbox(!showHitbox);
  });
  window.addEventListener('keyup', (e) => {
    if (!GAME_KEYS.has(e.code)) return;
    if (!isTyping(e.target)) e.preventDefault();
    keys[e.code] = false;
  });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  const ctxEl = document.getElementById('ctx'), ctxSpin = document.getElementById('ctxSpin');
  let ctxObj = null;
  const hideCtx = () => { ctxEl.style.display = 'none'; ctxObj = null; };
  window.addEventListener('contextmenu', (e) => {       // 도형 위에서 우클릭하면 "회전" 메뉴
    e.preventDefault();
    hideCtx();
    if (e.target !== canvas || !map) return;
    pointer.x = e.clientX; pointer.y = e.clientY;
    const c = pointerWorld();
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      if (ROT_TYPES.has(o.type) && inPoly(polyOf(o), c.x, c.y)) { ctxObj = o; break; }
    }
    if (!ctxObj) return;
    ctxSpin.textContent = ctxObj.spin ? '회전 멈추기' : '회전';
    ctxEl.style.left = Math.min(e.clientX, vw - 130) + 'px';
    ctxEl.style.top = Math.min(e.clientY, vh - 50) + 'px';
    ctxEl.style.display = 'block';
  });
  window.addEventListener('pointerdown', (e) => { if (!ctxEl.contains(e.target)) hideCtx(); }, true);
  ctxSpin.addEventListener('click', () => {            // 켜 두면 플레이 중에 계속 360도 돈다 (편집 모드에서는 멈춰 있다)
    if (ctxObj) { const b = snapshot(); ctxObj.spin = !ctxObj.spin; commit(b); }
    hideCtx();
  });
  function cancelTele() {
    if (!pendingTele) return;
    obstacles = obstacles.filter((o) => o !== pendingTele);
    sel = new Set(); pendingTele = null;
  }

  function toggleDance() {
    dance = !dance;
    danceStart = performance.now();
    const b = document.getElementById('danceBtn');
    b.setAttribute('aria-pressed', String(dance));
    b.textContent = '춤 모드: ' + (dance ? '켜짐' : '꺼짐');
  }

  /* ---------- 패널 ---------- */
  const editBtn = document.getElementById('editBtn');
  const hitBtn = document.getElementById('hitBtn');
  const editTools = document.getElementById('editTools');
  const editHelp = document.getElementById('editHelp');

  let delTimer = 0;

  // 색 고르기: 자주 쓰는 색을 누르면 고른 부분에 바로 입힌다
  const swatchBox = document.getElementById('swatches');

  colorInput.addEventListener('input', () => {

  colorInput.addEventListener('change', () => {
    if (liveBefore !== null) { commit(liveBefore); liveBefore = null; }
    colorInput.blur();
  });
  applyBtn.addEventListener('click', () => { paintSelection(curColor); applyBtn.blur(); });
  clearBtn.addEventListener('click', () => { paintSelection(null); clearBtn.blur(); });

  // 글자 내용과 크기
  textInput.addEventListener('input', () => {
    const o = soleObstacle();
    if (!o || o.type !== 'text') return;
    if (liveTextBefore === null) liveTextBefore = snapshot();
    o.text = textInput.value;
    layoutText(o);
    fitInMap(o);
    markDirty();
  });
  textInput.addEventListener('change', () => {
    if (liveTextBefore !== null) { commit(liveTextBefore); liveTextBefore = null; }
  });
  textInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') textInput.blur(); });
  textSize.addEventListener('input', () => {
    const o = soleObstacle();
    if (!o || o.type !== 'text') return;
    if (liveSizeBefore === null) liveSizeBefore = snapshot();
    o.size = parseFloat(textSize.value);
    textSizeOut.textContent = String(Math.round(o.size));
    layoutText(o);
    fitInMap(o);
    markDirty();
  });
  textSize.addEventListener('change', () => {
    if (liveSizeBefore !== null) { commit(liveSizeBefore); liveSizeBefore = null; }
    textSize.blur();
  });

  const gravBtn = document.getElementById('gravBtn');
  function setGravity(on) {
    gravityOn = on;
    gravBtn.setAttribute('aria-pressed', String(on));
    gravBtn.textContent = '중력 적용: ' + (on ? '켜짐' : '꺼짐');
    player.vy = 0;
  }
  gravBtn.addEventListener('click', () => { setGravity(!gravityOn); markDirty(); gravBtn.blur(); });

  const shapeBox = document.getElementById('shapeBox'), rotRange = document.getElementById('rotRange');
  const rotOut = document.getElementById('rotOut'), modeRow = document.getElementById('modeRow'), modeSel = document.getElementById('modeSel');
  const soleShape = () => { const o = editMode ? soleObstacle() : null; return o && ROT_TYPES.has(o.type) ? o : null; };
  rotRange.addEventListener('input', () => {
    const o = soleShape(); if (!o) return;
    if (liveRotBefore === null) liveRotBefore = snapshot();
    o.rot = parseFloat(rotRange.value);
    rotOut.textContent = Math.round(o.rot) + '°';
    markDirty();
  });
  rotRange.addEventListener('change', () => { if (liveRotBefore !== null) { commit(liveRotBefore); liveRotBefore = null; } rotRange.blur(); });
  modeSel.addEventListener('change', () => { const o = soleShape(); if (!o) return; const b = snapshot(); o.mode = modeSel.value; commit(b); modeSel.blur(); });

  let uiSig = '';
  function syncUI() {
    const sole = editMode ? soleObstacle() : null;
    const soleText = sole && sole.type === 'text' ? sole : null;
    if (soleText) {                                    // 글자 칸은 쓰는 중이 아닐 때만 맞춰 준다
      if (document.activeElement !== textInput && textInput.value !== soleText.text) textInput.value = soleText.text;
      if (document.activeElement !== textSize && parseFloat(textSize.value) !== soleText.size) {
        textSize.value = soleText.size;
        textSizeOut.textContent = String(Math.round(soleText.size));
      }
    }
    const sh = soleShape();
    if (sh && document.activeElement !== rotRange) { rotRange.value = sh.rot || 0; rotOut.textContent = Math.round(sh.rot || 0) + '°'; }
    const sig = editMode + '|' + tool + '|' + sel.size + '|' + (soleText ? soleText.id : 0) + '|' + (sh ? sh.id : 0);
    if (sig === uiSig) return;
    uiSig = sig;
    shapeBox.hidden = !sh;
    if (sh) { modeRow.hidden = sh.type === 'wall' || sh.type === 'hazard'; modeSel.value = sh.mode || 'pass'; }
    paintBox.hidden = !(editMode && (tool === 'paint' || soleText));
    textBox.hidden = !soleText;
    pickObjImage.hidden = !(editMode && tool === 'image');
    if (soleText) {
      textInput.value = soleText.text;
      textSize.value = soleText.size;
      textSizeOut.textContent = String(Math.round(soleText.size));
    }
    const n = sel.size;
    selInfo.textContent = n ? '선택한 부분 ' + n + '개' : '선택한 부분이 없어요';
    applyBtn.disabled = clearBtn.disabled = n === 0;
  }

  const pickBtn = document.getElementById('pickBtn');
  const mapFile = document.getElementById('mapFile');
  pickBtn.addEventListener('click', () => { mapFile.click(); pickBtn.blur(); });
  mapFile.addEventListener('change', () => {
    const f = mapFile.files[0];
    mapFile.value = '';
    if (document.activeElement) document.activeElement.blur();
    createMapFromFile(f);
  });

  const sizeRange = document.getElementById('sizeRange');
  const zoomRange = document.getElementById('zoomRange');
  sizeRange.addEventListener('input', () => {
    sizeScale = parseFloat(sizeRange.value);
    document.getElementById('sizeOut').textContent = sizeScale.toFixed(1) + '배';
    if (map) clampPoint(player);
  });
  zoomRange.addEventListener('input', () => {
    zoom = parseFloat(zoomRange.value);
    document.getElementById('zoomOut').textContent = zoom.toFixed(1) + '배';
    if (map) clampPoint(player);
  });
  [sizeRange, zoomRange].forEach((r) => r.addEventListener('pointerup', () => r.blur()));

  const danceBtn = document.getElementById('danceBtn');
  danceBtn.addEventListener('click', () => { toggleDance(); danceBtn.blur(); });

  /* 사진 끌어다 놓기 */
  const veil = document.getElementById('dropVeil');
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; veil.classList.add('show'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) veil.classList.remove('show'); });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    veil.classList.remove('show');
    if (PLAY_ONLY) return;
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    createMapFromFile(f);
  });

  /* 오류 안내 (잘 안 됐을 때만 나온다) */
  const toastEl = document.getElementById('toast');
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  /* ---------- 업데이트 ---------- */
  // 중력 모드: 벽 위에 서고, 사진 바닥에 닿으면 죽는다
  function gravityStep(dt, ch) {
    player.vy = (player.vy || 0) + JUMP_G * dt;
    const d = player.vy * ch * dt;
    const n = Math.max(1, Math.ceil(Math.abs(d) / (0.1 * ch)));
    const tryMove = (dd) => {
      for (let i = 0; i < 6; i++) {
        const ny = Math.min(player.y + dd, map.WH);
        if (wallOverlapArea(rectFor(hitPose(), player.x, ny, 0)) === 0) { player.y = ny; return true; }
        dd /= 2;
      }
      return false;
    };
    for (let i = 0; i < n; i++) if (!tryMove(d / n)) { if (d < 0) player.vy = 0; break; }
    const gp = posture === 'sit' ? 'sit' : posture === 'crouch' ? 'crouch' : 'idle';
    const grounded = player.vy >= 0 && wallOverlapArea(rectFor(gp, player.x, player.y + 0.02 * ch, 0)) > 0;
    if (grounded) { player.vy = 0; if (!player.onGround) { player.onGround = true; depenetrate('idle'); } }
    else player.onGround = false;
    if (player.y >= map.WH - 0.01) die();
  }

  function update(dt) {
    if (!map) return;
    if (drag) applyDrag();
    const ch = charH();

    if (deadTimer > 0) {
      // 죽어서 누워 있는 동안은 움직이지도 뛰지도 못한다
      moving = false;
      deadTimer -= dt;
      if (deadTimer <= 0) {
        deadTimer = 0;
        posture = 'stand';
        respawn();
        invuln = INVULN_SEC;
      }
    } else {
      updatePosture();

      const dx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      const g = gravityOn && !editMode;
      const dy = g ? 0 : (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
      const speed = MOVE_SPEED[posture];
      moving = speed > 0 && (dx !== 0 || dy !== 0);      // 앉아 있으면 움직이지 않는다
      if (moving) {
        const len = Math.hypot(dx, dy);
        const sp = ch * SPEED_PER_CHAR * speed * dt;
        movePlayer((dx / len) * sp, (dy / len) * sp);
      }

      if (g) gravityStep(dt, ch);
      else if (!player.onGround) {
        player.vz -= JUMP_G * dt;
        player.z += player.vz * dt;
        if (player.z <= 0) { player.z = 0; player.vz = 0; player.onGround = true; depenetrate('idle'); }
      }
      if (keys.Space && player.onGround) tryJump();       // 꾹 누르고 있으면 착지하자마자 다시 뛴다

      // 닿으면 죽는 구역: 캐릭터 그림 크기의 히트 박스가 닿으면 죽는다 (편집 모드에서는 죽지 않는다)
      if (invuln > 0) invuln -= dt;
      if (!editMode && invuln <= 0 && hitsRect('hazard', playerRect())) die();
      if (!editMode) {                                    // 텔레포터: 입구에 닿으면 이동되는 곳으로
        if (tpCool > 0) tpCool -= dt;
        else for (const o of obstacles) {
          if (o.type === 'tele' && o.tx != null && polyRectHit(polyOf(o), playerRect())) {
            player.x = o.tx; player.y = o.ty; clampPoint(player); player.vy = 0; snapCamera = true; tpCool = 1; break;
          }
        }
      }
    }
    if (flash > 0) flash = Math.max(0, flash - dt * 2);
    if (!editMode) spinT += dt;

    // 카메라: 캐릭터를 따라가고, 맵이 화면보다 작으면 가운데에 둔다
    const S = viewScale();
    const visW = vw / S, visH = vh / S;
    const tx = visW >= map.WW ? (map.WW - visW) / 2 : clamp(player.x - visW / 2, 0, map.WW - visW);
    const ty = visH >= map.WH ? (map.WH - visH) / 2 : clamp(player.y - charH() / 2 - visH / 2, 0, map.WH - visH);
    if (snapCamera) { cam.x = tx; cam.y = ty; snapCamera = false; }
    else {
      const k = 1 - Math.exp(-dt * 10);
      cam.x += (tx - cam.x) * k;
      cam.y += (ty - cam.y) * k;
    }
    syncUI();
  }

  /* ---------- 그리기 ---------- */
  function outlinedText(text, x, y) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, x, y);
  }

  // 글자와 이미지: 플레이 화면에서도 그대로 보인다 (캐릭터가 지나갈 수 있다)
  function pathPoly(P, S) {
    ctx.beginPath();
    P.forEach(([x, y], i) => { const px = (x - cam.x) * S, py = (y - cam.y) * S; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
    ctx.closePath();
  }
  function fillShape(o, S, fill, stroke) {
    pathPoly(polyOf(o), S);
    ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  function ring(cx, cy, r, col, label, edit) {
    ctx.save();
    ctx.fillStyle = hexToRgba(col, 0.28); ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0, 6.2832); ctx.stroke();
    if (edit) { ctx.font = '700 13px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; outlinedText(label, cx, cy); }
    ctx.restore();
  }
  function drawTele(o, S, edit) {
    const r = o.w / 2 * S;
    ring((o.x + o.w / 2 - cam.x) * S, (o.y + o.h / 2 - cam.y) * S, r, '#2b5fd9', '입구', edit);
    if (o.tx != null) ring((o.tx - cam.x) * S, (o.ty - cam.y) * S, r, '#f08a24', '출구', edit);
  }

  function drawDecor(S) {
    for (const o of obstacles) {
      if (o.type !== 'image' && o.type !== 'text') continue;
      const rx = (o.x - cam.x) * S, ry = (o.y - cam.y) * S, rw = o.w * S, rh = o.h * S;
      if (rx > vw || ry > vh || rx + rw < 0 || ry + rh < 0) continue;
      if (o.type === 'image') {
        const im = assetImg(o.asset);
        if (im && im.complete && im.naturalWidth) {
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(im, rx, ry, rw, rh);
        }
      } else {
        const fill = o.color || '#1f2a44';
        const px = o.size * S;
        ctx.font = '700 ' + px + 'px ' + FONT;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = px * 0.18;
        ctx.strokeStyle = hexLuma(fill) > 0.6 ? 'rgba(0,0,0,0.7)' : 'rgba(255,255,255,0.85)';
        ctx.fillStyle = fill;
        const lines = String(o.text == null ? '' : o.text).split('\n');
        lines.forEach((ln, i) => {
          const y = ry + (i + 0.5) * o.size * 1.25 * S;
          ctx.strokeText(ln, rx, y);
          ctx.fillText(ln, rx, y);
        });
      }
    }
  }

  // 플레이 모드: 색을 입힌 벽·즉사 구역·스폰 지점만 보인다 (나머지는 투명)
  function drawPaintLayer(S) {
    for (const o of obstacles) {
      if (o.type === 'tele') { drawTele(o, S, false); continue; }
      if (isShapeT(o.type) || ((o.type === 'wall' || o.type === 'hazard') && (o.rot || o.spin))) {
        if (isShapeT(o.type) || o.color) fillShape(o, S, o.color || defaultColor(modeOf(o)));
        continue;
      }
      if (!o.color || !isSolidType(o.type)) continue;
      const rx = (o.x - cam.x) * S, ry = (o.y - cam.y) * S, rw = o.w * S, rh = o.h * S;
      if (rx > vw || ry > vh || rx + rw < 0 || ry + rh < 0) continue;
      ctx.fillStyle = o.color;
      ctx.fillRect(rx, ry, rw, rh);
    }
    if (spawn.color) {
      const ch = charH() * S;
      const sx = (spawn.x - cam.x) * S, sy = (spawn.y - cam.y) * S;
      ctx.fillStyle = spawn.color;
      ctx.beginPath(); ctx.ellipse(sx, sy, 0.3 * ch, 0.09 * ch, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 편집 모드: 모든 장애물과 스폰 지점이 반투명으로 보인다 (색을 입힌 건 그 색으로)
  function drawEditLayer(S) {
    for (const o of obstacles) {
      const rx = (o.x - cam.x) * S, ry = (o.y - cam.y) * S, rw = o.w * S, rh = o.h * S;
      if (rw <= 0 || rh <= 0 || rx > vw || ry > vh || rx + rw < 0 || ry + rh < 0) continue;
      if (o.type === 'tele') { drawTele(o, S, true); continue; }
      if (isShapeT(o.type) || ((o.type === 'wall' || o.type === 'hazard') && (o.rot || o.spin))) {
        const m = modeOf(o);
        fillShape(o, S, o.color ? hexToRgba(o.color, 0.62) : m === 'wall' ? 'rgba(43,95,217,0.34)' : m === 'hazard' ? 'rgba(226,32,32,0.32)' : 'rgba(242,201,76,0.4)',
          m === 'wall' ? 'rgba(30,64,175,0.95)' : m === 'hazard' ? 'rgba(185,20,20,0.95)' : '#8a6d10');
        continue;
      }
      if (!isSolidType(o.type)) {                       // 글자·이미지는 상자 윤곽만 흐리게 보여 준다
        ctx.save();
        ctx.setLineDash([5, 4]);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(31,42,68,0.6)';
        ctx.strokeRect(rx, ry, rw, rh);
        ctx.restore();
        continue;
      }
      const wall = o.type === 'wall';
      ctx.fillStyle = o.color ? hexToRgba(o.color, 0.62) : (wall ? 'rgba(43,95,217,0.34)' : 'rgba(226,32,32,0.32)');
      ctx.fillRect(rx, ry, rw, rh);
      if (!wall) {
        ctx.save();
        ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.clip();
        ctx.strokeStyle = 'rgba(190,20,20,0.5)';
        ctx.lineWidth = 2;
        for (let i = -rh; i < rw; i += 14) {
          ctx.beginPath(); ctx.moveTo(rx + i, ry + rh); ctx.lineTo(rx + i + rh, ry); ctx.stroke();
        }
        ctx.restore();
      }
      ctx.lineWidth = 2;
      ctx.strokeStyle = wall ? 'rgba(30,64,175,0.95)' : 'rgba(185,20,20,0.95)';
      ctx.strokeRect(rx, ry, rw, rh);
      if (rw >= 44 && rh >= 24) {
        ctx.font = '700 13px ' + FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        outlinedText(wall ? '벽' : '즉사', rx + rw / 2, ry + rh / 2);
      }
    }

    const ch = charH() * S;
    const sx = (spawn.x - cam.x) * S, sy = (spawn.y - cam.y) * S;
    ctx.fillStyle = spawn.color ? hexToRgba(spawn.color, 0.62) : 'rgba(31,163,92,0.34)';
    ctx.strokeStyle = '#178048';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(sx, sy, 0.3 * ch, 0.09 * ch, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - 6, sy); ctx.lineTo(sx + 6, sy); ctx.moveTo(sx, sy - 4); ctx.lineTo(sx, sy + 4); ctx.stroke();
    ctx.font = '700 13px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    outlinedText('스폰', sx, sy - 0.09 * ch - 6);
  }

  function dashedOutline(drawPath) {
    ctx.strokeStyle = '#1f2a44'; ctx.lineWidth = 3; ctx.setLineDash([]);
    drawPath(); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
    drawPath(); ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawSelection(S) {
    if (!sel.size) return;
    ctx.save();
    for (const it of sel) {
      if (it === SPAWN) {
        const ch = charH() * S;
        const sx = (spawn.x - cam.x) * S, sy = (spawn.y - cam.y) * S;
        dashedOutline(() => { ctx.beginPath(); ctx.ellipse(sx, sy, 0.3 * ch + 4, 0.09 * ch + 4, 0, 0, Math.PI * 2); });
      } else {
        const rx = (it.x - cam.x) * S, ry = (it.y - cam.y) * S, rw = it.w * S, rh = it.h * S;
        if (ROT_TYPES.has(it.type) && it.rot) dashedOutline(() => pathPoly(polyOf(it), S));
        else dashedOutline(() => { ctx.beginPath(); ctx.rect(rx - 2, ry - 2, rw + 4, rh + 4); });
      }
    }
    const sole = resizableSole();
    if (sole) {
      for (const [cx, cy] of cornersOf(sole)) {
        const hx = (cx - cam.x) * S - HANDLE_PX / 2, hy = (cy - cam.y) * S - HANDLE_PX / 2;
        ctx.fillStyle = '#fff'; ctx.fillRect(hx, hy, HANDLE_PX, HANDLE_PX);
        ctx.strokeStyle = '#1f2a44'; ctx.lineWidth = 1.5; ctx.strokeRect(hx, hy, HANDLE_PX, HANDLE_PX);
      }
    }
    ctx.restore();
  }

  // R: 벽·즉사 구역·스폰 지점·캐릭터의 히트 박스
  function drawHitboxes(S) {
    ctx.save();
    ctx.font = '700 13px ' + FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const box = (l, t, r, b, color, label, dashed) => {
      const x = (l - cam.x) * S, y = (t - cam.y) * S, w = (r - l) * S, h = (b - t) * S;
      if (x > vw || y > vh || x + w < 0 || y + h < 0) return;
      ctx.fillStyle = hexToRgba(color, 0.14);
      ctx.fillRect(x, y, w, h);
      ctx.setLineDash(dashed ? [7, 5] : []);
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.strokeRect(x, y, w, h);
      ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.strokeRect(x, y, w, h);
      ctx.setLineDash([]);
      if (w >= 34 && h >= 20) outlinedText(label, x + 5, y + 4);
    };
    for (const o of obstacles) {
      if (!isSolidType(o.type)) continue;
      const wall = o.type === 'wall';
      box(o.x, o.y, o.x + o.w, o.y + o.h, wall ? '#2b5fd9' : '#e02020', wall ? '벽' : '즉사', false);
    }
    const sr = rectFor('idle', spawn.x, spawn.y);          // 스폰에서 서 있을 때 차지하는 자리
    box(sr.l, sr.t, sr.r, sr.b, '#1fa35c', '스폰', true);
    const sx = (spawn.x - cam.x) * S, sy = (spawn.y - cam.y) * S;
    ctx.strokeStyle = '#1fa35c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx - 7, sy); ctx.lineTo(sx + 7, sy); ctx.moveTo(sx, sy - 7); ctx.lineTo(sx, sy + 7); ctx.stroke();
    const pr = playerRect();
    box(pr.l, pr.t, pr.r, pr.b, '#ff9800', '캐릭터', false);
    ctx.restore();
  }

  function drawPlayer(S, now) {
    const ch = charH() * S;                         // 화면에서의 캐릭터 키(px)
    const k = ch / SPRITE_DIM.idle[1];              // 모든 자세에 같은 배율 적용
    const sx = (player.x - cam.x) * S;
    const sy = (player.y - cam.y) * S;

    // 자세 고르기
    let pose = 'idle';
    if (deadTimer > 0) pose = 'dead';
    else if (!player.onGround) pose = 'jump';
    else if (posture === 'sit') pose = 'sit';
    else if (posture === 'crouch') pose = 'crouch';
    else if (dance) pose = Math.floor((now - danceStart) / DANCE_STEP_MS) % 2 === 0 ? 'dance1' : 'dance2';

    const im = sprites[pose];
    const w = im.naturalWidth * k, h = im.naturalHeight * k;

    // 그림자 (높이 뜰수록 작고 옅어진다)
    const lift = clamp(player.z / JUMP_PEAK, 0, 1);
    const sh = 1 - lift * 0.35;
    ctx.fillStyle = 'rgba(0,0,0,' + (0.3 * sh).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(sx, sy, w * 0.45 * sh, ch * 0.05 * sh, 0, 0, Math.PI * 2);
    ctx.fill();

    let top;
    if (pose === 'jump') {
      // 머리 위치는 기본 자세와 같게 맞추고, 점프하면 그만큼 위로 올린다
      top = sy - ch - player.z * ch;
    } else if (pose === 'sit' || pose === 'crouch' || pose === 'dead') {
      top = sy - h;                                  // 바닥에 붙인다
    } else {
      const bob = moving ? Math.abs(Math.sin(now / 1000 * 12)) * 0.025 * ch : 0;
      top = sy - h - bob;
    }
    ctx.drawImage(im, sx - w / 2, top, w, h);
  }

  function render(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#27314a';
    ctx.fillRect(0, 0, vw, vh);
    if (!map) return;

    const S = viewScale();
    const mx = -cam.x * S, my = -cam.y * S;
    const mw = map.WW * S, mh = map.WH * S;

    if (mw < vw || mh < vh) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 28;
      ctx.fillStyle = '#000';
      ctx.fillRect(mx, my, mw, mh);
      ctx.restore();
    }
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(map.img, mx, my, mw, mh);

    // 편집 모드에서는 글자·이미지 위에 반투명 벽이 보이고, 플레이 모드에서는 색 입힌 벽 위에 글자·이미지가 놓인다
    if (editMode) { drawDecor(S); drawEditLayer(S); }
    else { drawPaintLayer(S); drawDecor(S); }
    if (spritesReady) drawPlayer(S, now);
    if (editMode) drawSelection(S);
    if (showHitbox) drawHitboxes(S);

    if (flash > 0) {
      ctx.fillStyle = 'rgba(210,31,31,' + (flash * 0.45).toFixed(3) + ')';
      ctx.fillRect(0, 0, vw, vh);
    }
  }

  /* ---------- 시작 ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render(now);
    requestAnimationFrame(frame);
  }

  function loadSprites() {
    const names = Object.keys(SPRITE_SRC);
    return Promise.all(names.map((n) => new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => { sprites[n] = im; res(); };
      im.onerror = () => rej(new Error(n));
      im.src = SPRITE_SRC[n];
    })));
  }

  window.addEventListener('resize', resize);
  resize();
  showScratch();
  setTool('select');
  loadSprites().then(() => { spritesReady = true; })
               .catch(() => toast('캐릭터 그림을 불러오지 못했어요.'));
  initStorage();                                      // 저장된 맵이 있으면 마지막으로 열었던 맵을, 저장한 맵 파일이면 그 맵을 불러온다
  
  requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
</html>
